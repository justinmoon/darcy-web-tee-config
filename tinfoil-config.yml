cvm-version: 0.14.16
cpus: 2
memory: 8192

networks:
  agent:
    egress: open

volumes:
  - name: workspace
    owner: "0:0"
    exec: true

containers:
  - name: agent
    image: ghcr.io/justinmoon/darcy-web-tee-config@sha256:96d9c90113d03b06ca6886c3d66853fb67924de2082759b38b7415ee37cc77f0
    cvm_admin: true
    read_only: true
    pids_limit: 128
    networks: [agent]
    persistent_volumes: [workspace:/workspace]
    env:
      - DARCY_INVITE_CODE_SHA256: "5ec62c9eebc683c4f256205ae721a549aec61e6788dde26a1a115a49b3b0d4ab"
      - DARCY_WEB_ORIGIN: "https://justinmoon.github.io"
      - DARCY_INFERENCE_RELEASE_SHA256: "5233a27f1468f474d27c103e06c1a7a607e6a722ff4f9299ddf4e32fa87f201e"
      - DARCY_INITIALIZE_NEW_VOLUME: "1"
      - DARCY_WEB_EPHEMERAL_DEV: "0"
      - DARCY_MARMOT_ENABLED: "1"
    secrets: [TINFOIL_API_KEY]
    tmpfs:
      /config: rw,nosuid,nodev,size=64m,mode=755
      /tmp: rw,nosuid,nodev,size=1g,mode=1777
      /run: rw,nosuid,nodev,size=64m,mode=755

shim:
  upstream-port: 8080
  authenticated: false
  paths: [/api, /healthz]
  origins: [https://justinmoon.github.io]
